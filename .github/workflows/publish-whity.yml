name: Publish whity (the plain package name)

# `npm install -g whity` (WHIT-1044, owner's choice 16 Nov 2026): the same command as
# @whity/cli under the name people type. packages/whity holds only a bin that runs
# @whity/cli at the same version, so bump both package.json files together.
# The name has to exist on npmjs.com, with this file set as its trusted publisher,
# before this workflow can publish it; that first claim is done by hand.

on:
  push:
    branches: [main]
    paths:
      - "packages/whity/**"
      - "packages/cli/package.json"
      - ".github/actions/publish-npm-package/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing (WHIT-834): npm exchanges this job's GitHub OIDC
    # token for a short-lived publish credential, so there is no npm token
    # secret anywhere. id-token: write is what lets the job request it.
    # npmjs.com trusts this file by name, so keep the file name as it is.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Shared steps (WHIT-1027); they run inside this job.
      - uses: ./.github/actions/publish-npm-package
        with:
          package: whity
          install: "false"
          test: "false"
