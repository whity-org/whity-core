# Step 1 of the release pipeline: prepare the version bump.
#
# THE PIPELINE, END TO END (WHIT-1340)
#
#   feature/… ──PR──▶ develop
#                        │
#      (1) the owner says "release"; this workflow is dispatched with a version
#                        │
#                        ▼
#            release/X.Y.Z ──PR──▶ main    auto-merge (merge commit) once
#                                    │     main's required checks are green
#      (2) release.yml sees main move: skips the suites that PR's CI already
#          ran on the same tree, runs the PostgreSQL migrate/seed check,
#          builds and smoke-tests the images, tags vX.Y.Z, publishes the
#          Release, and opens the back-merge PR with auto-merge armed
#                                    │
#                                    ▼
#            chore/back-merge-vX.Y.Z ──PR──▶ develop   merge queue
#
# One dispatch, no further clicks. The dispatch IS the owner's approval, which
# is why only the orchestrator runs it, and only on the owner's word.
#
# Until v0.2.31 the bump went to develop first, then a second PR promoted
# develop to main (release-promote.yml, now retired): two merges by hand, the
# release content still moving while the first one queued, and the full suites
# run three times over the same code. Measured on v0.2.31: 56 minutes.
#
# The PR goes straight to main, so the release is FROZEN at the develop commit
# it was cut from: nothing that lands on develop afterwards slips in. It merges
# by auto-merge, and `main` still refuses direct pushes from everyone including
# admins, so it merges only once main's required checks pass on it.
#
# This workflow only ever writes to a NEW `release/X.Y.Z` branch. It cannot move
# develop or main, so the worst a mistaken run can do is leave a branch and a PR
# you close (closing the PR before it merges cancels the release cleanly).
name: Release — prepare

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.2)'
        required: true
        type: string
      ref:
        description: 'Commit or branch to cut from (default: develop)'
        required: false
        default: 'develop'
        type: string

# Serialised, never cancelled (WHIT-277): a half-finished run of this
# workflow leaves the release in a state someone has to repair by hand.
# Two dispatches at once would both bump CoreVersion.php and open
# competing release PRs.
concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version and open the release PR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # Who opens this job's PR decides whether its CI runs on its own. GitHub
      # creates the pull_request runs of a PR opened with github.token in an
      # approval-required state, so every bot-opened release PR sat at
      # "action_required" until a person approved its runs by hand.
      # A GitHub App installation token -- or, failing that, a personal access
      # token in RELEASE_TOKEN -- opens it as an identity whose runs start
      # unattended. With neither configured the job still works and says, in
      # its summary, what will need approving. Setup: CONTRIBUTING.md,
      # "The release token".
      - name: Mint the release token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout the commit being released
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The release branch is pushed with the same token the PR is opened
          # with, so the release token is the only identity in play.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || github.token }}
          # The CHANGELOG edit and the version comparison both need history.
          fetch-depth: 0

      - name: Validate the requested version
        id: check
        run: |
          VERSION="${{ inputs.version }}"

          # Reject a leading v rather than silently accepting it: the tag is
          # built as v$VERSION later, and "vv0.2.2" would fail much further
          # along, after a branch and a PR already existed.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be MAJOR.MINOR.PATCH with no leading 'v' (got '${VERSION}')."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists. Releases are immutable — pick a new version."
            exit 1
          fi

          CURRENT=$(grep -oE "VERSION = '[^']+'" src/Core/CoreVersion.php | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "Current: ${CURRENT} → requested: ${VERSION}"

          # Strictly increasing, compared numerically per component. A version
          # that goes backwards would make `update:check` tell every deployment
          # it is ahead of the latest release.
          if [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" != "$VERSION" ] || [ "$CURRENT" = "$VERSION" ]; then
            echo "::error::Requested version ${VERSION} is not greater than the current ${CURRENT}."
            exit 1
          fi

          # The PR into main can only auto-merge when its head is up to date
          # with main: main's protection is strict, and nothing here may update
          # the branch by merging main into it. So main must already be inside
          # the commit being released. It is, once the previous release's
          # back-merge has landed on develop; when it has not (or a hotfix went
          # to main and has not come back), stop now rather than open a PR that
          # can never merge.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits that ${{ inputs.ref }} does not. Merge the open back-merge PR (chore/back-merge-v…) into develop first, then run this again."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=release/${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Refuse to prepare a release with no notes
        run: |
          # THE CHANGELOG'S [Unreleased] SECTION BECOMES THE RELEASE NOTES.
          # `release.yml` publishes it verbatim, so an empty section means a
          # release page with nothing on it.
          #
          # Checked HERE rather than at publish time on purpose. By the time
          # release.yml reaches the notes it has already run the full suite,
          # built three images, smoke-tested them and CREATED THE TAG — and a
          # tag is immutable. Failing at that point is recoverable (re-run the
          # job) but expensive and alarming. Failing here costs nothing: this
          # workflow has not written anything yet, so the fix is to write the
          # CHANGELOG and press the button again.
          #
          # v0.2.9 is why this exists: 47 merged pull requests, of which the
          # section described exactly one, and the omissions included a licence
          # change and the removal of four settings keys.
          body=$(awk '
            /^## \[Unreleased\]/ { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md | tr -d '[:space:]')

          # Entries now arrive as fragments in changelog.d/ (WHIT-791) and are
          # folded in by the next step, so they count as content too.
          fragments=$(find changelog.d -maxdepth 1 -type f -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l)

          if [ -z "$body" ] && [ "$fragments" -eq 0 ]; then
            echo "::error::CHANGELOG.md's [Unreleased] section is empty and changelog.d/ has no fragments. They become the release notes for this version — write them, then run this workflow again."
            exit 1
          fi

          echo "[Unreleased] has content; it will be dated as this release's notes."

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Fold changelog fragments into [Unreleased]
        # Each PR adds a file under changelog.d/ instead of editing the shared
        # [Unreleased] section, so parallel PRs stop conflicting (WHIT-791).
        # This folds them in and deletes them; `git add -A` below commits both.
        run: php scripts/changelog-assemble.php

      - name: Bump CoreVersion and date the CHANGELOG
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          # `php --`, not `php -`: PHP has no "-" convention for stdin and
          # treats it as a filename ("Could not open input file: -"). With no
          # file argument it reads the script from stdin, and `--` separates
          # that from the arguments that become $argv.
          php -- "$VERSION" <<'PHP'
          <?php
          $version = $argv[1];

          $path = 'src/Core/CoreVersion.php';
          $src  = file_get_contents($path);
          $out  = preg_replace("/VERSION = '[^']+'/", "VERSION = '{$version}'", $src, 1, $n);
          if ($n !== 1) {
              fwrite(STDERR, "::error::Could not find the VERSION constant in {$path}\n");
              exit(1);
          }
          file_put_contents($path, $out);

          // Close [Unreleased] into a dated section and leave a fresh heading
          // behind, so the next cycle has somewhere to write without anyone
          // having to remember to re-open it.
          $path = 'CHANGELOG.md';
          $log  = file_get_contents($path);
          if (substr_count($log, '## [Unreleased]') !== 1) {
              fwrite(STDERR, "::error::Expected exactly one '## [Unreleased]' heading in CHANGELOG.md\n");
              exit(1);
          }
          $today = gmdate('Y-m-d');
          $log = str_replace(
              '## [Unreleased]',
              "## [Unreleased]\n\n## [{$version}] - {$today}",
              $log
          );
          file_put_contents($path, $log);
          PHP

      # The plugin SDK coverage matrix names the core release it describes. A
      # matrix behind Sdk::VERSION fails here too, so a release cannot ship an
      # SDK minor the matrix does not account for.
      - name: Stamp the plugin SDK coverage matrix
        run: php scripts/sdk-coverage.php --release "${{ steps.check.outputs.version }}"

      - name: Regenerate the OpenAPI spec and typed clients
        run: |
          # The spec embeds the version, and the typed client is generated
          # from the spec, so both drift gates fail unless they are
          # regenerated here.
          #
          # Doing this in CI rather than on a laptop is deliberate: the
          # generator runs the LIVE router, so a locally-installed plugin would
          # publish its routes into core's public contract. A clean checkout has
          # only the in-tree plugins, which is exactly what the spec should
          # describe.
          php public/index.php generate:openapi
          npx openapi-typescript public/openapi.json -o packages/api-client/src/schema.d.ts

      - name: Verify the version is consistent everywhere
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          SPEC=$(php -r 'echo json_decode(file_get_contents("public/openapi.json"), true)["info"]["version"];')
          CORE=$(php -r "require 'vendor/autoload.php'; echo \Whity\Core\CoreVersion::VERSION;")
          if [ "$CORE" != "$VERSION" ] || [ "$SPEC" != "$VERSION" ]; then
            echo "::error::Version mismatch after bump — CoreVersion=${CORE}, openapi=${SPEC}, expected ${VERSION}."
            exit 1
          fi

      # The npm packages publish when main moves (publish-*.yml), but only a
      # version that isn't on the registry yet. So the release versions them
      # here (WHIT-1063): pending changesets bump their packages, and the typed
      # client, which follows core's API, gets a minor bump of its own when it
      # changed since the last release and no changeset named it. Without this
      # step a release published only what someone remembered to bump by hand.
      - name: Version the npm packages
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$PREV" ] && ! git diff --quiet "$PREV" -- packages/api-client/src \
             && ! grep -lq '"@whity/api-client"' .changeset/*.md 2>/dev/null; then
            printf '%s\n' '---' '"@whity/api-client": minor' '---' '' \
              "The typed client follows core's API as of ${{ steps.check.outputs.version }}." \
              > .changeset/api-client-release.md
          fi
          npx changeset version
          # Keep the lockfile's workspace versions in step with the bumps.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          for p in api-client ui tokens features cli; do
            echo "packages/${p}: $(node -p "require('./packages/${p}/package.json').version")"
          done

      - name: Commit and push the release branch
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          BRANCH="${{ steps.check.outputs.branch }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "release: ${VERSION}

          Bumps CoreVersion and dates the CHANGELOG section. The release
          workflow refuses any tag whose name is not v + this constant, so this
          has to land before the tag.

          public/openapi.json carries the version, and both typed clients are
          generated from it, so all three are regenerated here. Pending
          changesets version the npm packages, which publish when main moves."
          git push origin "$BRANCH"

      # Straight to main (WHIT-1340), with auto-merge armed: the dispatch was the
      # owner's approval, so nothing waits for a click. It merges the moment
      # main's required checks (CI gate, CodeQL, Semgrep, E2E gate) pass, and
      # never earlier: auto-merge cannot bypass protection.
      #
      # MERGE COMMIT, never squash. release.yml finds this PR's head as the
      # second parent of the merge commit, to skip the suites this PR's CI
      # already ran on the same tree; and the back-merge carries that commit
      # to develop, which a squash would make a stranger to develop's history.
      #
      # Armed only with the release token. A merge made by github.token pushes
      # main without starting any workflow (GitHub's rule against workflows
      # triggering workflows), so release.yml would never run.
      - name: Open the release PR to main and arm auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || github.token }}
          TOKEN_KIND: ${{ steps.app-token.outputs.token != '' && 'app' || secrets.RELEASE_TOKEN != '' && 'pat' || 'builtin' }}
          VERSION: ${{ steps.check.outputs.version }}
          BRANCH: ${{ steps.check.outputs.branch }}
          FROM_REF: ${{ inputs.ref }}
        run: |
          FROM_SHA=$(git rev-parse HEAD~1)

          # The body goes through a FILE: an inline multi-line --body keeps this
          # block's indentation, and Markdown renders indented lines as code.
          cat > "${RUNNER_TEMP}/release-body.md" <<EOF
          Prepared by **Release — prepare** from \`${FROM_REF}\` at ${FROM_SHA}. The release content is frozen there: nothing that lands on develop after it is in this release.

          Bumps \`CoreVersion::VERSION\` to \`${VERSION}\`, folds the changelog fragments into a dated CHANGELOG section, and regenerates \`public/openapi.json\` plus the typed client (the spec embeds the version). Pending changesets version the npm packages; each one whose version is new on npm publishes when **main** moves.

          ### What happens next, with nobody clicking

          1. Auto-merge merges this PR with a merge commit once main's required checks pass.
          2. \`release.yml\` sees main move. It skips PHPUnit, PHPStan and the frontend suites when this PR's own CI already passed them on the same tree, runs the PostgreSQL migrate and seed check, builds and smoke-tests the images, tags \`v${VERSION}\`, publishes the GitHub Release, and opens the back-merge PR into develop with auto-merge armed.

          Closing this PR before it merges cancels the release cleanly: nothing is tagged or published until **main** moves.

          The CHANGELOG section this dated is the release notes.
          EOF

          URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: ${VERSION}" \
            --body-file "${RUNNER_TEMP}/release-body.md")
          echo "Opened ${URL}"

          if [ "$TOKEN_KIND" = "builtin" ]; then
            echo "::warning::The release PR was opened with github.token: its CI waits for approval, and auto-merge is NOT armed, because a merge by github.token would not start release.yml. Approve the runs on ${URL} and merge it with a merge commit by hand, or configure the release token (CONTRIBUTING.md, 'The release token')."
            {
              echo "### ${URL} needs a person"
              echo ""
              echo "This PR was opened with github.token. GitHub holds its workflow runs until someone with write access approves them (**Approve workflows to run**), and a merge made by github.token would not start \`release.yml\`, so auto-merge is not armed: merge it by hand, with a merge commit, once it is green."
              echo ""
              echo "Configure the release token (CONTRIBUTING.md, *The release token*) and the release runs from the dispatch alone."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr merge "$URL" --auto --merge
          echo "Auto-merge armed on ${URL} (merge commit)."
          {
            echo "### Release ${VERSION} is on its way"
            echo ""
            echo "${URL} merges into main by itself once its checks pass; \`release.yml\` then tags and publishes \`v${VERSION}\`."
          } >> "$GITHUB_STEP_SUMMARY"
