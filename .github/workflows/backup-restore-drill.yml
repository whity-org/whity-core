# WC-d: rehearsed backup + restore drill (verifies the backup is RESTORABLE).
#
# A backup you have never restored is not a backup. This exercises the real
# scripts/backup-db.sh -> scripts/restore-db.sh round-trip on a genuine
# PostgreSQL, with encryption on, and asserts the restored copy is complete
# (seeded rows present) and migration-consistent (`migrate run` is a no-op and
# `migrate status` is clean). It also prints the restore duration (RTO signal).
#
# WHIT-1211 (#1908): it then proves the guard against empty and invalid dumps.
# backup-db.sh must fail without a marker when the database is missing or has
# no tables; restore-db.sh must refuse an empty (20-byte) and a damaged dump;
# with no file named it must skip both for the real dump; and the freshness
# exporter must report the newest dump as invalid.
#
# Uses only a throwaway local backup (no S3, no real secrets), so it runs in CI
# unattended: on a weekly schedule, on manual dispatch, and on any PR that
# touches the backup/restore scripts (so a change to them is proven before merge).
name: Backup/Restore Drill

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'   # weekly, after the security scan
  pull_request:
    paths:
      - 'scripts/backup-db.sh'
      - 'scripts/restore-db.sh'
      - 'scripts/lib/backup-check.sh'
      - 'ops/alerting/backup-freshness-textfile.sh'
      - 'ops/alerting/prometheus-rules.yml'
      - '.github/workflows/backup-restore-drill.yml'

permissions:
  contents: read

jobs:
  drill:
    name: Backup then restore-to-clean + verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: whity
          POSTGRES_PASSWORD: whity_dev
          POSTGRES_DB: whity_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whity -d whity_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: whity
      PGPASSWORD: whity_dev
      # Exercise encryption-at-rest in the drill.
      BACKUP_ENCRYPTION_KEY: drill-encryption-key-min-32-chars-aaaaaaaa
      BACKUP_DIR: ./backups

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none

      # The client must match the server's major version (the pg15 service
      # above). The runner's default postgresql-client is newer (18): its
      # pg_dump writes `SET transaction_timeout`, which a 15 server rejects on
      # restore. A real deployment dumps with its own server's client, so the
      # drill does too. Keep this in step with the service image.
      - name: Install PostgreSQL client (same major as the server)
        env:
          PG_MAJOR: '15'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Client and server major versions match
        run: |
          client="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          server="$(psql -d whity_core -tAc 'SHOW server_version_num' | cut -c1-2)"
          echo "pg_dump ${client}, server ${server}"
          [ "$client" = "$server" ] || { echo "::error::pg_dump ${client} does not match the server ${server}; the dump would not restore."; exit 1; }

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Write .env (source DB)
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=whity_core
          DB_USER=whity
          DB_PASSWORD=whity_dev
          JWT_SECRET=ci_jwt_secret_min_32_chars_for_hs256_aaaa
          ENCRYPTION_KEY=ci_encryption_key_min_32_chars_bbbbbbbb
          INITIAL_ADMIN_PASSWORD=admin123
          INITIAL_USER_PASSWORD=user123
          INITIAL_SYSTEM_ADMIN_PASSWORD=systemadmin123
          INITIAL_SUPERUSER_PASSWORD=superuser123
          EOF

      - name: Migrate + seed the source database
        run: |
          php public/index.php migrate run
          php public/index.php seed

      - name: Back up the source database (encrypted)
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: whity_core
          DB_USER: whity
          DB_PASSWORD: whity_dev
        run: bash scripts/backup-db.sh

      - name: Create a clean restore target
        run: createdb whity_restore

      - name: Restore into the clean target (timed — RTO signal)
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: whity_restore
          DB_USER: whity
          DB_PASSWORD: whity_dev
        run: |
          backup="$(ls -1 ./backups/whity_*.sql.gz.enc | head -1)"
          echo "Restoring from: ${backup}"
          start=$(date +%s)
          bash scripts/restore-db.sh "$backup"
          end=$(date +%s)
          echo "Restore duration (RTO): $((end - start))s"

      - name: Migrate the restored DB (must be a no-op) + status
        run: |
          sed -i 's/^DB_NAME=whity_core$/DB_NAME=whity_restore/' .env
          php public/index.php migrate run
          php public/index.php migrate status

      - name: Verify the restore is complete
        run: |
          set -e
          tenants=$(psql -d whity_restore -tAc 'SELECT count(*) FROM tenants;')
          profiles=$(psql -d whity_restore -tAc 'SELECT count(*) FROM profiles;')
          echo "Restored rows — tenants: ${tenants}, profiles: ${profiles}"
          if [ "${tenants}" -lt 1 ] || [ "${profiles}" -lt 1 ]; then
            echo "::error::Restore verification failed — expected seeded rows in the restored database."
            exit 1
          fi
          echo "Restore verified: seeded data present and migration-consistent."

      # ── WHIT-1211 (#1908): empty and invalid dumps ─────────────────────────
      - name: Backup of a missing or empty database fails without a marker
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: whity
          DB_PASSWORD: whity_dev
          BACKUP_WAIT_FOR_DB_SECONDS: '4'
        run: |
          set -u
          marker_before="$(cat ./backups/.last-success)"
          count_before="$(ls -1 ./backups/whity_* | grep -vc '\.invalid$' || true)"

          if DB_NAME=whity_missing bash scripts/backup-db.sh; then
            echo "::error::backup-db.sh reported success for a database that does not exist."
            exit 1
          fi

          createdb whity_empty
          if DB_NAME=whity_empty bash scripts/backup-db.sh; then
            echo "::error::backup-db.sh reported success for a dump with no tables."
            exit 1
          fi
          ls ./backups/whity_whity_empty_*.sql.gz.invalid

          [ "$(cat ./backups/.last-success)" = "$marker_before" ] || { echo "::error::The marker moved after a failed backup."; exit 1; }
          count_after="$(ls -1 ./backups/whity_* | grep -vc '\.invalid$' || true)"
          [ "$count_after" = "$count_before" ] || { echo "::error::A failed backup left a file that looks like a dump."; exit 1; }
          if ls ./backups/.partial_* 2>/dev/null; then echo "::error::A .partial_ file was left behind."; exit 1; fi
          echo "Failed backups left no dump and no marker update."

      - name: Plant an empty and a damaged dump, newer than the real one
        run: |
          real="$(ls -1 ./backups/whity_whity_core_*.sql.gz.enc | head -1)"
          # The #1908 case: a gzip of nothing (20 bytes), encrypted like the rest.
          printf '' | gzip -9 > /tmp/empty.sql.gz
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/empty.sql.gz             -out ./backups/whity_whity_core_29990101T000000Z.sql.gz.enc -pass "pass:${BACKUP_ENCRYPTION_KEY}"
          # A dump cut short: the first half of the real gzip, encrypted.
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$real" -pass "pass:${BACKUP_ENCRYPTION_KEY}" > /tmp/real.sql.gz
          head -c "$(( $(stat -c %s /tmp/real.sql.gz) / 2 ))" /tmp/real.sql.gz > /tmp/cut.sql.gz
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/cut.sql.gz             -out ./backups/whity_whity_core_29990102T000000Z.sql.gz.enc -pass "pass:${BACKUP_ENCRYPTION_KEY}"
          touch -d '+1 hour' ./backups/whity_whity_core_29990101T000000Z.sql.gz.enc
          touch -d '+2 hour' ./backups/whity_whity_core_29990102T000000Z.sql.gz.enc
          ls -lt ./backups

      - name: restore-db.sh refuses the empty and the damaged dump
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: whity_restore_guard
          DB_USER: whity
          DB_PASSWORD: whity_dev
        run: |
          createdb whity_restore_guard
          for f in ./backups/whity_whity_core_29990101T000000Z.sql.gz.enc ./backups/whity_whity_core_29990102T000000Z.sql.gz.enc; do
            if bash scripts/restore-db.sh "$f" 2> /tmp/err; then
              echo "::error::restore-db.sh restored an invalid dump: $f"
              exit 1
            fi
            cat /tmp/err
            grep -q 'REFUSED' /tmp/err
          done
          tables=$(psql -d whity_restore_guard -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          [ "$tables" = "0" ] || { echo "::error::A refused restore still wrote ${tables} tables."; exit 1; }
          echo "Both invalid dumps were refused before touching the database."

      - name: With no file named, restore-db.sh skips them for the newest valid dump
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: whity_restore_guard
          DB_USER: whity
          DB_PASSWORD: whity_dev
        run: |
          bash scripts/restore-db.sh 2> /tmp/err
          cat /tmp/err
          grep -q 'skipping .*29990102T000000Z' /tmp/err
          grep -q 'skipping .*29990101T000000Z' /tmp/err
          tenants=$(psql -d whity_restore_guard -tAc 'SELECT count(*) FROM tenants;')
          [ "$tenants" -ge 1 ] || { echo "::error::The no-file restore did not restore the real dump."; exit 1; }
          echo "No-file restore skipped the invalid dumps and restored ${tenants} tenants."

      - name: The freshness exporter reports the newest dump as invalid
        run: |
          TEXTFILE_DIR=/tmp/textfile bash ops/alerting/backup-freshness-textfile.sh
          cat /tmp/textfile/whity_backup.prom
          grep -qx 'whity_backup_latest_valid 0' /tmp/textfile/whity_backup.prom
          grep -qx 'whity_backup_latest_verified 1' /tmp/textfile/whity_backup.prom
          grep -q '^whity_backup_last_success_timestamp_seconds ' /tmp/textfile/whity_backup.prom
          # Remove the planted dumps: the real one is newest again, and valid.
          rm ./backups/whity_whity_core_2999*.sql.gz.enc
          TEXTFILE_DIR=/tmp/textfile bash ops/alerting/backup-freshness-textfile.sh
          grep -qx 'whity_backup_latest_valid 1' /tmp/textfile/whity_backup.prom
          echo "Exporter: invalid newest dump = 0, real newest dump = 1."

      - name: Check the alert rules
        run: |
          docker run --rm -v "$PWD/ops/alerting:/rules:ro" --entrypoint promtool             prom/prometheus:v2.53.0 check rules /rules/prometheus-rules.yml
