name: Publish @whity/cli

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - ".github/actions/publish-npm-package/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing (WHIT-834): npm exchanges this job's GitHub OIDC
    # token for a short-lived publish credential, so there is no npm token
    # secret anywhere. id-token: write is what lets the job request it.
    # npmjs.com trusts this file by name, so keep the file name as it is.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Shared steps (WHIT-1027); they run inside this job.
      - uses: ./.github/actions/publish-npm-package
        with:
          package: cli
          install: "false"
          test: "true"
