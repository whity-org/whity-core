# Release pipeline (WC-172): pushing a tag `vX.Y.Z` publishes a core release.
#
# Gates, in order:
#   1. verify / postgres-integration / web — full parity with the PR gate
#      (.github/workflows/automated-tests.yml): the tag name must equal
#      `v` + CoreVersion::VERSION (a release can never ship with a lying
#      version), the full backend suite + static analysis + plugin smoke must
#      pass, migrations + seed must run on real PostgreSQL, and the frontend
#      types/tests/generated-artifact drift checks must pass on the tagged
#      commit. A release is never gated weaker than a PR.
#   2. images (images.yml) — build ALL THREE production container images and push them to
#      GHCR under the same tags (vX.Y.Z and latest): the backend
#      (`ghcr.io/<repo>`, root Dockerfile `release` stage — code + no-dev
#      vendor baked in), the frontend (`ghcr.io/<repo>/web`, web/Dockerfile
#      `runtime` stage — the built Next app) and the document render tier
#      (`ghcr.io/<repo>/render`, render-service/Dockerfile `runtime` stage —
#      headless Chromium printing the document editor's documents and label
#      sheets). A deployment is not the product without the first two, so they
#      ship together or not at all. The render tier is optional to RUN (a
#      compose profile most deployments never start) but not optional to
#      PUBLISH: it is only correct against the core release it was built from
#      (it bakes in that release's CoreVersion) — see images.yml and
#      docs/wiki/Document-Render-Service.md.
#   3. release — create the GitHub Release with auto-generated notes (the
#      source archives GitHub attaches are the deploy artifact for
#      checkout-based hosts; the GHCR images serve container-based ones).
#
# Consumers check for updates with `php public/index.php update:check` and
# apply them via docs/wiki/Core-Update.md.
name: Release

on:
  push:
    # Two entry points, one pipeline.
    #
    #   branches: [main]  the NORMAL path. Merging the develop -> main release
    #                     PR publishes the release; the tag is created here,
    #                     after the gates pass, rather than by a human beforehand.
    #   tags: ['v*']      the ESCAPE HATCH. Pushing a tag by hand still works,
    #                     for re-running a release whose publish step failed or
    #                     for tagging a commit that is already on main.
    #
    # Both converge on the `resolve` job below, which is the only place that
    # decides what is being released.
    branches:
      - main
    tags:
      - 'v*'

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      # The tag being released, WITH the leading v (e.g. v0.2.2). Every job that
      # names an image or the release uses this rather than github.ref_name,
      # because on the branch-push path there is no tag ref to read.
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      # false = this push to main was not a release (no version bump), so every
      # downstream job skips. Ordinary fixes can land on main freely.
      go: ${{ steps.r.outputs.go }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what is being released
        id: r
        run: |
          VERSION=$(grep -oE "VERSION = '[^']+'" src/Core/CoreVersion.php | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "CoreVersion::VERSION = ${VERSION}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Hand-pushed tag: it is authoritative, but it must agree with the
            # constant or the release would ship a version that lies.
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG}" != "v${VERSION}" ]; then
              echo "::error::Tag ${TAG} does not match CoreVersion::VERSION (${VERSION}). Bump src/Core/CoreVersion.php first, then tag."
              exit 1
            fi
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            # Push to main. Release only if this version has never been tagged;
            # otherwise this is an ordinary commit and must not re-publish.
            TAG="v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::notice::${TAG} already exists — this push to main is not a release. Skipping."
              echo "go=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::main is at ${VERSION} with no ${TAG} tag — releasing."
              echo "go=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify tag + full suite
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.go == 'true'
    # Far more than the steps below need, so only a hung run reaches it, and it
    # is cut off within the hour instead of at the six-hour default.
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-release-verify-${{ hashFiles('composer.lock') }}
          restore-keys: composer-release-verify-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: The release must match CoreVersion::VERSION
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          # `resolve` read the constant with grep; this reads it through the
          # autoloader. Two independent mechanisms agreeing is the point - the
          # failure guarded here is a release that ships a version different
          # from the one it claims, and grep alone could be fooled by a comment
          # or a second constant.
          #
          # Compared against RELEASE_TAG, not the git ref: on the normal path
          # this workflow is triggered by a push to main, where the ref name is
          # "main" and there is no tag to read yet.
          VERSION=$(php -r "require 'vendor/autoload.php'; echo \Whity\Core\CoreVersion::VERSION;")
          if [ "${RELEASE_TAG}" != "v${VERSION}" ]; then
            echo "::error::Releasing ${RELEASE_TAG} but CoreVersion::VERSION is ${VERSION}. Bump src/Core/CoreVersion.php first."
            exit 1
          fi
          echo "Releasing version ${VERSION}"

      # Parallel, as the suite runs on every PR. One process running all of it
      # took 53 minutes at v0.2.26, then 1h43m at v0.2.27, when the runner was
      # lost partway through with no test failing.
      - name: Run PHPUnit
        run: vendor/bin/paratest --processes "$(nproc)"

      # Same paths and memory limit as every PR (the composer script, #934):
      # this used to list its own paths, without `ops`.
      - name: Run PHPStan
        run: composer phpstan

      - name: Plugin-load smoke
        run: php scripts/ci-plugin-smoke.php

      # A release must not ship an in-tree plugin whose screens silently do not
      # register (#969) — loading successfully is not the same as contributing
      # the UI the plugin declares.
      - name: Plugin frontend-feature registration guard
        run: php scripts/ci-plugin-frontend-features.php

      # A core release ships templates/tauri-desktop/ as the source an operator
      # builds their desktop app from, so a release cutting with a stale
      # vendored SDK hands every device a plugin contract older than the one
      # this same tag publishes to plugin authors (#849).
      - name: Vendored-SDK parity (desktop template)
        run: php scripts/ci-vendored-sdk-parity.php

  postgres-integration:
    name: Migrations + seed on real PostgreSQL
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      contents: read

    # A real PostgreSQL service so migrations/seed run against the actual engine.
    # This catches Postgres-specific bugs the SQLite test suite cannot — e.g. use
    # of a reserved keyword as an identifier (WC-65: `symmetric`), which only
    # fails on PostgreSQL.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: whity
          POSTGRES_PASSWORD: whity_dev
          POSTGRES_DB: whity_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whity -d whity_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-release-postgres-${{ hashFiles('composer.lock') }}
          restore-keys: composer-release-postgres-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # The app reads configuration from $_ENV (not getenv); the CLI bootstrap
      # loads a .env file into $_ENV, so write one rather than rely on the runner's
      # variables_order including 'E'.
      - name: Write .env for the CLI bootstrap
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=whity_core
          DB_USER=whity
          DB_PASSWORD=whity_dev
          JWT_SECRET=ci_jwt_secret_min_32_chars_for_hs256_aaaa
          ENCRYPTION_KEY=ci_encryption_key_min_32_chars_bbbbbbbb
          INITIAL_ADMIN_PASSWORD=admin123
          INITIAL_USER_PASSWORD=user123
          INITIAL_SYSTEM_ADMIN_PASSWORD=systemadmin123
          INITIAL_SUPERUSER_PASSWORD=superuser123
          EOF

      - name: Run migrations on real PostgreSQL
        run: php public/index.php migrate run

      - name: Seed on real PostgreSQL
        run: php public/index.php seed

      - name: Re-run migrations (idempotency on PostgreSQL)
        run: php public/index.php migrate run

      # A release must not ship a route gated on a permission nobody holds (#990).
      # On upgrade that is a capability an operator HAD and silently loses, on a
      # deployment nobody is watching — the sovereign long-lived installs this
      # platform sells into apply migrations incrementally, so the tag is the last
      # point at which the grant and the gate can still be shipped together.
      - name: Permission-holder guard
        run: php scripts/ci-permission-holder-guard.php

  web:
    name: Frontend types, tests & generated-artifact drift
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      contents: read

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          # Single lockfile at the workspace root (npm workspaces).
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      # The committed lib/api/schema.d.ts must match a fresh generation from
      # public/openapi.json — API changes that skip `npm run generate:api`
      # would ship a typed client that lies about the contract (WC-168).
      - name: Typed-client schema drift check
        run: |
          npm run generate:api
          git diff --exit-code -- lib/api/schema.d.ts

      # The committed design-token outputs must match the generator (base.json
      # is the single source of truth for styling variables).
      - name: Design-token drift check
        run: npm run tokens:check

      # The shadcn registry manifest must stay buildable; its output is
      # generated at build time (prebuild) and never committed.
      - name: Registry build smoke
        run: npm run registry:build

      - name: Type check
        run: npx tsc --noEmit

      # ESLint gate (WC-122): zero errors required; warnings are tolerated.
      - name: Lint
        run: npm run lint

      # A full production build gates build-breaking RSC/route errors and a
      # broken prebuild shadcn-registry generation (WC-180); kept in parity with
      # the PR gate (automated-tests.yml) so a release is never gated weaker than
      # a PR. `npm run build` runs the `prebuild` registry hook then `next build`.
      # On Next 16 `next build` no longer runs ESLint — lint is its own gate.
      - name: Build (production)
        run: npm run build

      - name: Run Jest
        run: npx jest

  # Build, push and smoke-test the app, web and render images (vX.Y.Z + latest).
  # The jobs live in images.yml, shared with develop-images.yml, so the images
  # app.whity.dev deploys from develop are built and gated the same way.
  images:
    name: Images
    needs: [resolve, verify, postgres-integration, web]
    if: needs.resolve.outputs.go == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write   # WC-d: upload the Trivy image-scan SARIF
    uses: ./.github/workflows/images.yml
    with:
      commit: ${{ github.sha }}
      tag: ${{ needs.resolve.outputs.tag }}
      extra-tags: latest
      version: ${{ needs.resolve.outputs.version }}

  release:
    name: Tag and create the GitHub Release
    runs-on: ubuntu-latest
    # smoke is now a gate: a release image that does not boot and serve /api/health
    # can never become a published GitHub Release (and thus never be picked up by
    # sovereign deployments running `update:check`).
    needs: [resolve, verify, postgres-integration, web, images]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout the commit being released
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the release
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          # Deliberately LAST - after the suite, both image builds, and the
          # smoke test against the PUBLISHED images.
          #
          # A tag created up front and then orphaned by a failed build is the
          # worst outcome available here: releases are immutable, so the tag
          # cannot be moved, and the next attempt would need a brand-new
          # version number for a failure that had nothing to do with the code.
          # Creating it here means a failed run is simply re-runnable.
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::notice::${RELEASE_TAG} already exists (hand-pushed tag path) - not recreating."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${RELEASE_TAG}" -m "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create the release, with the CHANGELOG section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # WHY NOT `--generate-notes` ALONE, WHICH IS WHAT THIS USED TO DO.
          #
          # That publishes the raw list of merged pull requests and nothing
          # else. v0.2.9 shipped 47 of them, and sitting in that list at equal
          # weight with a dependency bump were the two things a reader had to
          # be told: the licence changed from the Commons Clause condition to
          # AGPL-3.0-only, and the `payments.cliq_*` settings were removed, so
          # anyone who had configured them found keys that no longer existed.
          # Both were written up properly in CHANGELOG.md. Neither reached the
          # release page, and the notes had to be replaced by hand afterwards.
          #
          # `release-prepare` already tells you, in the PR it opens, "Read the
          # CHANGELOG section this dated. It is the release notes." This makes
          # that true.
          #
          # The generated pull-request list is kept, folded into a <details>
          # block: it answers "did my fix ship?", which the prose never does.
          #
          # awk rather than a scripting runtime: this job installs neither PHP
          # nor Node, and a release must not fail on a missing interpreter at
          # the last step before publishing.
          SECTION="${RUNNER_TEMP}/section.md"
          NOTES="${RUNNER_TEMP}/release-notes.md"

          awk -v ver="${VERSION}" '
            $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1                        { exit }
            inside                                                  { print }
          ' CHANGELOG.md > "$SECTION"

          # FAIL RATHER THAN PUBLISH EMPTY NOTES. Blank notes are worse than
          # the PR list alone, and unrecoverable in the way that matters:
          # people read the page on the day it ships. The tag already exists
          # by this point, so a re-run after fixing the CHANGELOG picks up
          # from here rather than burning a version number.
          if [ ! -s "$SECTION" ]; then
            echo "::error::CHANGELOG.md has no content under '## [${VERSION}]'. Write the release notes there, then re-run this job."
            exit 1
          fi

          cp "$SECTION" "$NOTES"

          # --notes-file and --generate-notes are mutually exclusive, so the
          # generated list is fetched through the API and appended.
          {
            printf '\n\n---\n\n<details>\n<summary>Every merged pull request in this release</summary>\n\n'
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${RELEASE_TAG}" --jq .body
            printf '\n\n</details>\n'
          } >> "$NOTES"

          # The compose file of this version, which `whity install` and
          # `whity update` (@whity/cli) download by this name.
          COMPOSE_ASSET="${RUNNER_TEMP}/whity-compose.yml"
          cp docker/production/docker-compose.yml "$COMPOSE_ASSET"

          gh release create "${RELEASE_TAG}" "$COMPOSE_ASSET" \
            --title "${RELEASE_TAG}" \
            --notes-file "$NOTES" \
            --verify-tag

  back-merge:
    name: Open the back-merge PR
    runs-on: ubuntu-latest
    # Only once the release actually published. A back-merge for a release
    # that failed to ship would carry a version bump onto develop describing
    # a release nobody can install.
    needs: [resolve, release]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      # The back-merge is a branch this job pushes, not main itself.
      contents: write
      pull-requests: write

    steps:
      # See release-prepare.yml: a PR opened with github.token has its CI held
      # for approval. Setup: CONTRIBUTING.md, "The release token".
      - name: Mint the release token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || github.token }}

      - name: Open the back-merge PR from a branch off develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || github.token }}
          TOKEN_KIND: ${{ steps.app-token.outputs.token != '' && 'app' || secrets.RELEASE_TOKEN != '' && 'pat' || 'builtin' }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          git fetch --quiet origin develop main
          DEVELOP=$(git rev-parse origin/develop)
          MAIN=$(git rev-parse origin/main)

          # The release merge commit lives only on main, so develop reads as
          # "behind" the moment a release ships even though the trees are
          # identical. Left alone across several releases, main accumulates
          # merge commits develop has never seen and "is main ahead?" stops
          # being answerable at a glance. Closing that loop here is what makes
          # it a step nobody has to remember.
          BEHIND=$(git rev-list --count "${DEVELOP}..${MAIN}")
          if [ "$BEHIND" = "0" ]; then
            echo "::notice::develop already contains main. Nothing to back-merge."
            exit 0
          fi

          # The PR comes from a branch built on develop, NOT from main. A PR whose
          # head is main can merge only while develop has not moved since the
          # release: strict protection (enforced for admins) requires the head
          # to be up to date with the base, and the only way to update main is
          # to merge unreleased develop work onto the release line. Every
          # back-merge through v0.2.17 hit this and had to be rebuilt by hand
          # (#1375 -> #1389, #1392 -> #1393). A branch off develop can always
          # be brought up to date with update-branch.
          BRANCH="chore/back-merge-${RELEASE_TAG}"
          EXISTING=$(gh pr list --base develop --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "::notice::PR #${EXISTING} already back-merges ${RELEASE_TAG} into develop."
            exit 0
          fi

          # The merge is computed without a checkout: a conflict here means main
          # carries a change develop contradicts, which no bot should resolve.
          if ! TREE=$(git merge-tree --write-tree "$DEVELOP" "$MAIN"); then
            echo "::error::main and develop conflict, so the back-merge needs a person. Merge origin/main into a branch off develop by hand, resolve, and open the PR."
            exit 1
          fi

          # Normally the result is develop's own tree: the release merge commit
          # adds nothing develop lacks. It differs only when something reached
          # main without passing through develop (a hotfix cut from main), and
          # then this PR is what carries it back -- so it is opened either way,
          # but says which case it is.
          CHANGED=$(git diff --name-only "$DEVELOP" "$TREE")
          if [ -z "$CHANGED" ]; then
            CONTENT="Expect **zero file changes**: the merge tree is identical to develop's. This carries main's release merge commit back onto develop so git stops reporting develop as behind."
          else
            COUNT=$(printf '%s\n' "$CHANGED" | wc -l | tr -d ' ')
            CONTENT="This carries **${COUNT} changed file(s)** from main that never went through develop (a hotfix cut from main?). Review them like any other change before merging."
            echo "::warning::The back-merge carries ${COUNT} file(s) develop does not have."
          fi

          COMMIT=$(GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit-tree "$TREE" -p "$DEVELOP" -p "$MAIN" \
              -m "chore: back-merge main into develop after ${RELEASE_TAG}")

          # Force: a re-run builds a new commit, and this branch belongs to the
          # job (an open PR for it already returned above).
          git push --force origin "${COMMIT}:refs/heads/${BRANCH}"

          # The body goes through a FILE, not an inline --body string: an inline
          # multi-line string inside this block scalar keeps the step's
          # indentation, and Markdown renders indented lines as a code block.
          # Heredoc body lines sit at this step's indentation on purpose: YAML
          # strips it, so the shell (and the rendered Markdown) see column 0.
          cat > "${RUNNER_TEMP}/back-merge-body.md" <<EOF
          Opened automatically after **${RELEASE_TAG}** published.

          ${CONTENT}

          ## Merge with a MERGE COMMIT

          A squash would drop main's release commit from develop's history, which is the one thing this PR exists to carry.

          ## If develop moves before you merge

          The head is a branch off develop, so **Update branch** (or \`gh pr update-branch\`) brings it up to date and it stays mergeable. Nothing here ever pushes to main.
          EOF

          URL=$(gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: back-merge main into develop after ${RELEASE_TAG}" \
            --body-file "${RUNNER_TEMP}/back-merge-body.md")
          echo "Opened ${URL}"
          if [ "$TOKEN_KIND" = "builtin" ]; then
            echo "::warning::The back-merge PR was opened with github.token, so GitHub holds its CI for approval. Approve the runs on ${URL}, or configure the release token (CONTRIBUTING.md, 'The release token')."
            {
              echo "### CI on ${URL} is waiting for approval"
              echo ""
              echo "This PR was opened with github.token, and GitHub holds the workflow runs of such PRs until someone with write access approves them: open the PR and choose **Approve workflows to run**."
              echo ""
              echo "Configure the release token (CONTRIBUTING.md, *The release token*) and release PRs start their CI on their own."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
