<!doctype html>
<html lang="en" dir="ltr" xmlns="http://www.w3.org/1999/xhtml">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark">
<title>Your Whity receipt for {{month}}</title>
<style>
  body { margin:0; padding:0; background:#f4f4f5; }
  a { color:#0961bb; }
  @media (max-width:620px) { .card { padding:24px 20px !important; border-radius:0 !important; } .outer { padding:0 !important; } }
  @media (prefers-color-scheme: dark) {
    body, .bg { background:#09090b !important; } .card { background:#18181b !important; }
    .card h1, .card p, .card td { color:#f4f4f5 !important; } .card .soft, .foot p { color:#a1a1aa !important; }
    .rows, .note td { background:#27272a !important; } .rows td { border-color:#3f3f46 !important; }
  }
</style></head>
<body style="margin:0;padding:0;background:#f4f4f5">
<div style="display:none;max-height:0;overflow:hidden;opacity:0">{{fee}} for {{tenant_name}}. Thank you.</div>
<table role="presentation" class="bg" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f5"><tr><td class="outer" align="center" style="padding:32px 16px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;font-family:'Noto Sans', 'Segoe UI', Arial, Helvetica, sans-serif;text-align:left" dir="ltr">
<tr><td class="card" style="background:#ffffff;border-radius:18px;padding:36px 40px"><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 26px"><tr><td style="width:40px;height:40px"><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background:#0961bb;border-radius:8px"><tr><td style="padding:0 0 9px 9px"><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="width:19px;height:19px;border-radius:5px;background:#ffffff;border:2px solid #0961bb;font-size:0;line-height:0">&nbsp;</td></tr></table></td></tr></table></td><td style="width:12px"></td><td style="font-size:18px;font-weight:700;color:#18181b">Whity</td></tr></table><h1 style="margin:0 0 14px;font-size:25px;line-height:1.3;font-weight:700;color:#18181b">Thank you. Here’s your receipt.</h1><table role="presentation" class="rows" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 22px;background:#f4f4f5;border-radius:12px"><tr><td style="padding:10px 16px;font-size:16px;color:#52525b;border-top:0">Workspace</td><td style="padding:10px 16px;font-size:16px;font-weight:400;color:#18181b;text-align:right;border-top:0;white-space:nowrap">{{tenant_name}}</td></tr><tr><td style="padding:10px 16px;font-size:16px;color:#52525b;border-top:1px solid #e4e4e7">Team plan</td><td style="padding:10px 16px;font-size:16px;font-weight:400;color:#18181b;text-align:right;border-top:1px solid #e4e4e7;white-space:nowrap"><span dir="ltr">{{plan_fee}}</span></td></tr><tr><td style="padding:10px 16px;font-size:16px;color:#52525b;border-top:1px solid #e4e4e7">Your brand (white-label)</td><td style="padding:10px 16px;font-size:16px;font-weight:400;color:#18181b;text-align:right;border-top:1px solid #e4e4e7;white-space:nowrap"><span dir="ltr">{{wl_fee}}</span></td></tr><tr><td style="padding:10px 16px;font-size:16px;color:#52525b;border-top:1px solid #e4e4e7">Total</td><td style="padding:10px 16px;font-size:16px;font-weight:700;color:#18181b;text-align:right;border-top:1px solid #e4e4e7;white-space:nowrap"><span dir="ltr">{{fee}}</span></td></tr></table><p style="margin:0 0 16px;font-size:17px;line-height:1.6;color:#18181b">Paid on {{when}} with the card ending 4821. The PDF receipt is attached.</p><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 22px"><tr><td style="border-radius:12px;background:#0961bb"><a href="{{url}}" style="display:inline-block;padding:15px 30px;font-size:17px;font-weight:700;line-height:22px;color:#ffffff;text-decoration:none;border-radius:12px">See billing</a></td></tr></table></td></tr>
<tr><td class="foot" style="padding:20px 8px 0;font-size:13px;line-height:1.6;color:#71717a"><p style="margin:0 0 8px;font-size:13px;line-height:1.6;color:#71717a">Whity · Billing</p></td></tr>
</table></td></tr></table>
</body></html>
