<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../preview-runtime/react.production.min.js"></script><script src="../../preview-runtime/react-dom.production.min.js"></script><script src="../bundle.js"></script><script>(function(){var t=(location.hash.match(/theme=(dark|light)/)||[])[1]||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script><style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);width:1880px;min-height:2193px}</style><meta charset="utf-8"><title>In-app moments</title><style>html,body{margin:0} 
.mo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; padding: 28px; background: var(--muted); }
.mo-col { display: grid; gap: 8px; align-content: start; }
.mo-label { font: 500 13px/1.3 var(--font-mono, ui-monospace, monospace); letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); display: flex; justify-content: space-between; gap: 8px; }
.mo-label em { font-style: normal; color: var(--primary); text-transform: none; letter-spacing: 0; }
.mo-panel { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; min-height: 470px; display: flex; flex-direction: column; }
.mo-bar { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 16px; }
.mo-bar small { margin-inline-start: auto; font-weight: 400; color: var(--muted-foreground); font-size: 14px; }
.mo-body { flex: 1; display: grid; place-items: center; text-align: center; padding: 18px 26px 26px; }
.mo-in { display: grid; justify-items: center; gap: 10px; max-width: 330px; }
.mo-in h3 { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.3; }
.mo-in p { margin: 0; color: var(--muted-foreground); font-size: 16px; line-height: 1.5; }
.mo-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 6px; }
.mo-lot { width: 240px; height: 180px; }
.mo-lot.is-small { width: 150px; height: 150px; }
.mo-lot .w-lottie, .mo-lot .w-lottie__stage { width: 100%; height: 100%; }
.mo-toast { margin: 18px; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 12px 30px -12px rgb(0 0 0 / .25); display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; text-align: start; }
.mo-toast .mo-lot { width: 96px; height: 72px; }
.mo-toast b { display: block; font-size: 16.5px; }
.mo-toast span { color: var(--muted-foreground); font-size: 15px; }
.mo-row { display: flex; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); text-align: start; font-size: 15.5px; }
.mo-row small { display: block; color: var(--muted-foreground); font-size: 14px; }
.mo-row .mo-amt { margin-inline-start: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.mo-prop { margin: 16px; padding: 16px; border-radius: 16px; border: 1.5px dashed var(--primary); text-align: start; display: grid; gap: 8px; }
.mo-prop h4 { margin: 0; font-size: 17.5px; }
.mo-prop .mo-btns { justify-content: flex-start; }
[data-lottie-scope][data-state="approved"] .mo-prop { border-style: solid; }
[data-lottie-scope][data-state="approved"] [data-lottie-do="approve"], [data-lottie-scope][data-state="approved"] [data-lottie-do="decline"] { display: none; }
[data-lottie-scope]:not([data-state="approved"]) [data-lottie-do="undo"], [data-lottie-scope]:not([data-state="approved"]) .mo-after { display: none; }
.mo-progress { width: 100%; height: 10px; border-radius: 99px; background: var(--muted); overflow: hidden; }
.mo-progress i { display: block; height: 100%; width: 62%; border-radius: inherit; background: var(--primary); }
.mo-set { display: grid; gap: 10px; padding: 18px; text-align: start; }
.mo-opt { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 14px; border-radius: 14px; border: 1px solid var(--border); }
.mo-opt.is-on { border-color: var(--primary); background: color-mix(in oklab, var(--primary) 6%, transparent); }
.mo-opt i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); margin-top: 2px; }
.mo-opt.is-on i { border: 6px solid var(--primary); }
.mo-opt b { display: block; font-size: 16px; } .mo-opt span { color: var(--muted-foreground); font-size: 14.5px; }
.mo-note { font-size: 14px; color: var(--muted-foreground); }
.mo-steps { display: flex; gap: 6px; justify-content: center; }
.mo-steps i { width: 26px; height: 6px; border-radius: 3px; background: var(--primary); }
.w-lottie.is-calm { animation: mo-fade .4s ease-out; }
@keyframes mo-fade { from { opacity: 0; } to { opacity: 1; } }
